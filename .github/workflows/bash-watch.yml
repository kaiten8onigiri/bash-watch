name: Watch official basketball shoe releases

on:
  schedule:
    # Every Monday at 12:00 JST (03:00 UTC).
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      notify_initial:
        description: "Notify all current items when creating the baseline"
        required: false
        type: boolean
        default: false

# Write access is used only to persist the append-only history on the state branch.
permissions:
  contents: write

concurrency:
  group: basketball-shoe-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out monitor
        uses: actions/checkout@v4
        with:
          path: app
      - name: Check out durable state
        uses: actions/checkout@v4
        with:
          ref: state
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/pyproject.toml
      - name: Install
        run: pip install ./app
      - name: Check official pages and notify
        working-directory: app
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          extra=""
          if [ "${{ inputs.notify_initial }}" = "true" ]; then extra="--notify-initial"; fi
          bash-watch --state "$GITHUB_WORKSPACE/state/data/state.json" --notify $extra
      - name: Persist known product history
        working-directory: state
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No new product identities to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "state: record newly observed products"
          git push origin HEAD:state
