[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bash-watch"
version = "0.1.0"
description = "Monitor official basketball shoe pages and notify only on changes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx[socks]>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
bash-watch = "bash_watch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bash_watch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "pip-build-env-*"]
